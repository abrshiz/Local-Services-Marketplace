name: localservicemarket
description: Local Services Marketplace — customers, providers, booking & payments.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  get_it: ^8.0.3
  uuid: ^4.5.1
  intl: ^0.20.2
  dio: ^5.8.0
  connectivity_plus: ^6.1.4
  shared_preferences: ^2.5.3
  geolocator: ^13.0.4
  google_maps_flutter: ^2.12.1
  table_calendar: ^3.2.0
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.4
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_launcher.png
  adaptive_icon_background: "#F5F3EE"
  adaptive_icon_foreground: assets/app_launcher.png
  remove_alpha_ios: false
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/
